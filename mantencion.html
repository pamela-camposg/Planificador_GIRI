<title>Mantención GIRI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#CCFF00">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<style>
/* Mismo sistema de diseño que Planificador GIRI: barra lima, tarjetas blancas con borde izquierdo,
   Neo Sans / Barlow Semi Condensed. Contenedores grandes 8px; todo lo coloreado en ángulo recto o 6px como en el Planificador. Solo tema claro. */
:root{
  --neon:#CCFF00; --neon-suave:#FBFFE8; --tinta:#031716;
  --z50:#FAFAFA; --z100:#F4F4F5; --z200:#E4E4E7; --z300:#D4D4D8;
  --z400:#A1A1AA; --z500:#71717A; --z600:#52525B; --z700:#3F3F46;
  --rojo:#C0392B; --rojoBg:#FCEDEB; --ambar:#B26A00; --ambarBg:#FFF8EC;
  --verde:#1E8E4E; --verdeBg:#F2F9F4; --blanco:#FFFFFF;
  --font:'Neo Sans','Neo Sans W01','Barlow Semi Condensed',system-ui,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{overflow-x:hidden}
body{font-family:var(--font);background:var(--z100);color:var(--tinta);-webkit-font-smoothing:antialiased;font-size:13px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--neon)}
::selection{background:var(--neon);color:var(--tinta)}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}

.watermark{pointer-events:none;position:fixed;left:-277px;top:-18px;z-index:0;height:716px;width:716px;user-select:none;opacity:.17}
.watermark img{height:100%;width:100%;object-fit:contain;display:block}

header.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--neon)}
.topbar-in{margin:0 auto;max-width:1100px;display:flex;align-items:center;gap:1.25rem;min-height:4.5rem;padding-block:.6rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex-wrap:wrap}
.topbar-in .logo{height:2rem;width:auto;display:block;flex:0 0 auto}
.divider{height:2.25rem;width:1px;background:rgba(3,23,22,.25)}
.app-title{min-width:0;line-height:1.25}
.app-title p{margin:0}
.app-title p:first-child{font-size:17px;font-weight:500;letter-spacing:-.01em}
.app-title p:last-child{margin-top:.125rem;font-size:13px;color:rgba(3,23,22,.7)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:.625rem}
.pill-top{display:flex;align-items:center;gap:.5rem;border-radius:6px;background:var(--tinta);color:var(--blanco);padding:.5rem .75rem;font-size:12px}
.dot{width:6px;height:6px;border-radius:9999px;background:var(--neon);flex-shrink:0;animation:latir 2.4s ease-in-out infinite}
@keyframes latir{0%,100%{opacity:1}50%{opacity:.35}}

.canvas{position:relative;z-index:1;margin:0 auto;max-width:1100px;padding-block:2rem 3rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page-head{margin-bottom:1.25rem;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:1rem}
.lime-rule{display:block;height:3px;width:2.5rem;background:var(--neon);margin-bottom:1rem}
h1{font-size:2.25rem;line-height:2.5rem;font-weight:500;letter-spacing:-.01em;margin:0;text-wrap:balance}
.bajada{margin:.625rem 0 0;max-width:40rem;font-size:14px;line-height:1.6;color:var(--z500)}
.switch{display:inline-flex;border:1px solid var(--z200);border-radius:6px;padding:2px;background:var(--blanco);flex-wrap:wrap}
.switch a{text-decoration:none;padding:.45rem .95rem;font-size:13px;color:var(--z500);border-radius:4px;transition:.15s}
.switch a:hover{background:var(--z50);color:var(--tinta)}
.switch a[aria-current="page"]{background:var(--neon);color:var(--tinta);font-weight:500}

.proto{margin:0 0 1.25rem;border:1px solid var(--z200);border-left:3px solid var(--neon);border-radius:0 6px 6px 0;background:var(--z50);padding:.7rem .95rem;font-size:12.5px;color:var(--z600)}

.stack{display:flex;flex-direction:column;gap:1.25rem}
.card{border:1px solid var(--z200);border-left:3px solid var(--z200);border-radius:8px;background:var(--blanco);padding:1.25rem 1.5rem 1.5rem;transition:border-color .3s,box-shadow .3s}
.card:hover{border-left-color:var(--neon);box-shadow:0 8px 30px rgb(0 0 0 / .04)}
.card-head{display:flex;align-items:baseline;gap:.75rem;flex-wrap:wrap}
.fmtNum{display:inline-flex;height:1.25rem;min-width:1.5rem;padding:0 .3rem;align-items:center;justify-content:center;border-radius:3px;background:var(--z100);font-size:10px;font-weight:600;color:var(--z500);transition:.3s}
.card:hover .fmtNum{background:var(--neon);color:var(--tinta)}
.card h2{font-size:15px;font-weight:500;letter-spacing:-.01em;margin:0}
.card-note{margin:.375rem 0 0;max-width:46rem;font-size:13px;line-height:1.6;color:var(--z500)}
.tag{border-radius:4px;background:var(--z100);padding:.125rem .5rem;font-size:10px;font-weight:500;letter-spacing:.12em;color:var(--z500);text-transform:uppercase}
.tag.crit{background:var(--tinta);color:var(--neon)}
.tag.critB{background:var(--z100);color:var(--z600)}
.head-right{margin-left:auto;font-size:12px;color:var(--z500)}

.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.75rem;margin-top:1rem}
.kpi{border:1px solid var(--z200);border-radius:6px;padding:.8rem .9rem;background:var(--z50)}
.kpi .n{font-size:28px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--z500);margin-top:.4rem}
.kpi.bad .n{color:var(--rojo)}
.kpi.ok .n{color:var(--verde)}

.cap{margin-top:1rem}
.caprow{display:flex;justify-content:space-between;gap:.75rem;align-items:center;flex-wrap:wrap;font-size:12.5px;margin-bottom:.45rem;color:var(--z600)}
.caprow b{color:var(--tinta);font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--z100);position:relative;overflow:hidden}
.bar>span{position:absolute;inset:0 auto 0 0;background:var(--neon)}
.dock-filter{border:1px solid var(--z200);border-radius:6px;background:var(--blanco);padding:.4rem .55rem;font-size:12.5px;color:var(--tinta)}
.notice{margin-top:1rem;border:1px solid #E6D5B0;border-left:3px solid var(--ambar);border-radius:0 6px 6px 0;background:var(--ambarBg);padding:.7rem .9rem;font-size:12.5px;color:#7A4A05}
.notice b{font-weight:600}

.tasks{margin-top:.9rem;border-top:1px solid var(--z200)}
.task{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.5rem 1rem;padding:.8rem 0;border-bottom:1px solid var(--z200)}
.task:last-child{border-bottom:none;padding-bottom:0}
.task .d{font-size:14px;font-weight:500}
.task .m{display:flex;flex-wrap:wrap;gap:.2rem .9rem;font-size:12px;color:var(--z500);margin-top:.2rem;font-variant-numeric:tabular-nums}
.late{color:var(--rojo);font-weight:600}
.soon{color:var(--ambar);font-weight:600}
.task details{grid-column:1/-1;font-size:12.5px;color:var(--z600)}
.task details p{margin:.35rem 0 0}
.task summary{cursor:pointer;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--z400);width:max-content}
.task summary:hover{color:var(--tinta)}
.acts{display:flex;gap:.4rem;align-items:flex-start}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;background:var(--neon);color:var(--tinta);border:1px solid var(--neon);border-radius:6px;padding:.5rem 1rem;font-size:12.5px;font-weight:600;transition:.15s ease;white-space:nowrap}
.btn:hover{background:var(--tinta);color:var(--neon);border-color:var(--tinta);transform:translateY(-1px)}
.btn.secondary{background:var(--blanco);color:var(--tinta);border-color:var(--z200);font-weight:500}
.btn.secondary:hover{border-color:var(--neon);background:var(--neon-suave);color:var(--tinta)}
.link-btn{background:none;border:0;padding:2px 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--z400)}
.link-btn:hover{color:var(--tinta)}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--tinta);outline-offset:2px}

.motivos{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;font-size:12.5px;color:var(--z600)}
.rs-opt{border:1px solid var(--z200);border-radius:6px;background:var(--blanco);padding:.45rem .75rem;font-size:12.5px;color:var(--tinta)}
.rs-opt:hover{background:var(--tinta);border-color:var(--tinta);color:var(--blanco)}
.done{grid-column:1/-1;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;font-size:12.5px;padding:.5rem .75rem;background:var(--verdeBg);border-left:3px solid var(--verde);color:#14663A}
.done.no{background:var(--rojoBg);border-left-color:var(--rojo);color:#7B2318}
.done input{width:110px;padding:.25rem .45rem;border:1px solid var(--z300);border-radius:4px;font-size:12.5px}

.tscroll{overflow-x:auto;margin-top:.9rem}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--z500);text-align:left;padding:.55rem .6rem;background:var(--z50);border-bottom:1px solid var(--z200);white-space:nowrap}
td{padding:.65rem .6rem;border-bottom:1px solid var(--z200);vertical-align:top}
td.num,th.num{text-align:right}
.minibar{width:80px;height:6px;background:var(--z100);position:relative;display:inline-block;vertical-align:middle;margin-right:.4rem}
.minibar span{position:absolute;inset:0 auto 0 0;background:var(--neon)}
.src{font-size:11.5px;color:var(--z500)}

.help{margin-top:1rem;display:flex;flex-direction:column;gap:.55rem;font-size:13px;color:var(--z600);padding:0;list-style:none}
.help li{display:flex;align-items:baseline;gap:.6rem}
.help li b.k{font-weight:600;color:var(--tinta);font-size:10px;background:var(--neon);width:17px;height:17px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.help li span b{color:var(--tinta);font-weight:600}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem;margin-top:1rem}
.mail{border:1px solid var(--z200);border-radius:6px;overflow:hidden;background:var(--blanco)}
.mail .mh{padding:.7rem .9rem;border-bottom:1px solid var(--z200);font-size:12px;color:var(--z500);display:grid;gap:.1rem;background:var(--z50)}
.mail .mh b{color:var(--tinta);font-weight:600}
.mail .mb{padding:.9rem;font-size:13px;display:grid;gap:.6rem}
.mail ul{margin:0;padding-left:1.1rem;display:grid;gap:.2rem}
.mail .alert{font-size:10px;font-weight:600;letter-spacing:.1em;padding:.1rem .4rem;background:var(--rojo);color:var(--blanco);margin-right:.4rem}
.rule{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.6rem;align-items:start;font-size:13px;padding-block:.6rem;border-top:1px solid var(--z200)}
.rule:first-child{border-top:none}
.rule .sq{width:9px;height:9px;margin-top:.3rem;background:var(--rojo)}
.rule .sq.y{background:var(--ambar)}
.rule .sq.g{background:var(--neon);outline:1px solid var(--tinta)}
.rules{margin-top:.6rem}
.hbars{display:grid;gap:.5rem;margin-top:.9rem}
.hb{display:grid;grid-template-columns:150px minmax(0,1fr) 28px;gap:.6rem;align-items:center;font-size:12.5px}
.empty{font-size:13px;color:var(--z500);margin:.9rem 0 0}

@media (max-width:640px){
  h1{font-size:1.75rem;line-height:2rem}
  .topbar-in{gap:.75rem;min-height:3.75rem}
  .topbar-in .logo{height:1.5rem}
  .divider{height:1.75rem}
  .app-title p:last-child{display:none}
  .card{padding:1rem 1rem 1.15rem}
  .kpis{gap:.5rem}
  .kpi{padding:.6rem}
  .kpi .n{font-size:22px}
  .task{grid-template-columns:minmax(0,1fr)}
  .split{grid-template-columns:minmax(0,1fr)}
  .hb{grid-template-columns:110px minmax(0,1fr) 24px}
  .head-right{display:none}
  .watermark{opacity:.1}
}
@media (prefers-reduced-motion:reduce){.dot{animation:none}.btn:hover{transform:none}}
</style>
<style>
.confirm{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.5rem .75rem;align-items:flex-end;padding:.65rem .75rem;background:var(--neon-suave);border-left:3px solid var(--neon)}
.confirm label{display:grid;gap:.2rem;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--z500)}
.confirm input{width:150px;padding:.4rem .5rem;border:1px solid var(--z300);border-radius:4px;font-size:13px;text-transform:none;letter-spacing:0;color:var(--tinta)}
.confirm input.wide{width:240px}
.rowlink{cursor:pointer}
.rowlink:hover td{background:var(--neon-suave)}
.rowlink td b{text-decoration:underline;text-underline-offset:2px;text-decoration-color:var(--z300)}
.back{display:inline-flex;align-items:center;gap:.35rem;font-size:12px;color:var(--z500);text-decoration:none;margin-bottom:.25rem}
.back:hover{color:var(--tinta)}
.estado{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:.1rem .4rem;white-space:nowrap}
.estado.v{background:var(--rojoBg);color:var(--rojo)}
.estado.p{background:var(--ambarBg);color:var(--ambar)}
.estado.a{background:var(--verdeBg);color:var(--verde)}
.estado.s{background:var(--z100);color:var(--z500)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tinta);color:var(--blanco);padding:.6rem 1rem;border-radius:6px;font-size:13px;z-index:80;max-width:calc(100% - 32px)}
.toast.err{background:var(--rojo)}
.pill-top{cursor:pointer;border:0;font-family:inherit}
.reglist{margin:.9rem 0 0;padding:0;list-style:none;border-top:1px solid var(--z200)}
.reglist li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.6rem;padding:.55rem 0;border-bottom:1px solid var(--z200);font-size:12.5px;align-items:baseline}
.reglist .when{color:var(--z500);font-variant-numeric:tabular-nums;white-space:nowrap}
.ok-t{color:var(--verde);font-weight:600}
.refman{color:var(--z500);white-space:nowrap}

footer.footer{position:relative;z-index:1;border-top:1px solid var(--z200);background:#fff}
.footer-in{margin:0 auto;max-width:1100px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.75rem;padding-block:1.5rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:12px;color:var(--z400)}
.toast{background:var(--green);color:#fff;font-weight:600}
.bar.avance-sem{height:10px;border-radius:5px}
.bar.avance-sem>span{background:var(--green);border-radius:5px}
.toast.err{background:var(--rojo)}

/* "Cómo hacerlo": botón desplegable */
details.como{grid-column:1/-1;margin-top:.15rem}
details.como>summary{list-style:none;display:inline-flex;align-items:center;gap:.45rem;cursor:pointer;user-select:none;
  padding:.45rem .8rem .45rem .55rem;border:1px solid var(--z200);border-radius:999px;background:var(--z50);
  font-size:12.5px;font-weight:600;letter-spacing:.02em;text-transform:none;color:var(--z700);width:auto;transition:background .15s,border-color .15s}
details.como>summary::-webkit-details-marker{display:none}
details.como>summary:hover{border-color:var(--neon);background:var(--neon-suave);color:var(--tinta)}
details.como[open]>summary{background:var(--neon-suave);border-color:var(--neon);color:var(--tinta)}
.como-ic{width:22px;height:22px;border-radius:50%;background:var(--neon);color:var(--tinta);display:inline-flex;align-items:center;justify-content:center}
.como-ic svg{width:13px;height:13px}
.como-chev{display:inline-flex;color:var(--z400);transition:transform .2s}
.como-chev svg{width:14px;height:14px}
details.como[open] .como-chev{transform:rotate(180deg);color:var(--tinta)}
.como-body{margin-top:.55rem;border:1px solid var(--z200);border-left:3px solid var(--neon);border-radius:8px;background:#fff;padding:.75rem .9rem;display:grid;gap:.55rem}
.como-body p{margin:0;font-size:14px;line-height:1.5;color:var(--tinta)}
.como-ref{display:flex;flex-wrap:wrap;align-items:center;gap:.35rem;font-size:12px;color:var(--z600);background:var(--z50);border-radius:6px;padding:.35rem .6rem;width:fit-content;max-width:100%}
.como-ref i{font-style:normal;color:var(--z400)}
.como-doc{display:inline-flex;color:var(--z500)}
.como-doc svg{width:14px;height:14px}
@media (max-width:640px){ details.como>summary{padding:.6rem .95rem .6rem .6rem;font-size:13.5px} .como-body p{font-size:15px} }
.modal{position:fixed;inset:0;z-index:90;background:rgba(3,23,22,.45);display:flex;align-items:center;justify-content:center;padding:20px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.modal[hidden]{display:none}
.modal-box{background:#fff;border-radius:16px;width:100%;max-width:380px;padding:24px 20px 20px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal-ic{width:56px;height:56px;margin:0 auto 12px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center}
.modal-ic svg{width:28px;height:28px}
.modal-box h3{margin:0;font-size:19px;font-weight:600;line-height:1.3}
.modal-tarea{margin:.6rem 0 0;font-size:16px;color:var(--z600);line-height:1.4}
.modal-btns{display:grid;gap:10px;margin-top:20px}
.btn-si{min-height:56px;border-radius:12px;border:2px solid var(--green-dark);background:var(--green);color:#fff;font-size:16px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;cursor:pointer}
.btn-cancelar{min-height:50px;border-radius:12px;border:1.5px solid var(--z300);background:#fff;color:var(--z600);font-size:15px;cursor:pointer}
body.con-modal{overflow:hidden}
/* Botones Hecha / No hecha: mismo estilo que la app de Detenciones */
:root{--green:#00873D;--green-dark:#006830;--green-light:#E8F5EE;--green-mid:#B8DFC8;--red-dark:#922B21;--red-light:#FDF0EE;--red-mid:#F1A9A0}
.btn-accion{border-radius:16px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-width:112px;min-height:76px;padding:10px 12px;border:2px solid transparent;cursor:pointer;user-select:none;transition:background .15s,transform .1s}
.btn-accion:active{transform:scale(.96)}
.btn-icono{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.15)}
.btn-icono svg{width:18px;height:18px}
.btn-texto{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;line-height:1.2}
.btn-andar{background:var(--green-light);border-color:var(--green-mid)}
.btn-andar .btn-icono{background:var(--green)}
.btn-andar .btn-texto{color:var(--green)}
.btn-andar:hover,.btn-andar.activo{background:var(--green);border-color:var(--green-dark)}
.btn-andar:hover .btn-texto,.btn-andar.activo .btn-texto{color:#fff}
.btn-andar:hover .btn-icono,.btn-andar.activo .btn-icono{background:rgba(255,255,255,.2);box-shadow:none}
.btn-parar{background:var(--red-light);border-color:var(--red-mid)}
.btn-parar .btn-icono{background:var(--rojo)}
.btn-parar .btn-texto{color:var(--rojo)}
.btn-parar:hover,.btn-parar.activo{background:var(--rojo);border-color:var(--red-dark)}
.btn-parar:hover .btn-texto,.btn-parar.activo .btn-texto{color:#fff}
.btn-parar:hover .btn-icono,.btn-parar.activo .btn-icono{background:rgba(255,255,255,.2);box-shadow:none}
.btn-guardar{border-radius:12px;background:var(--green);border:2px solid var(--green-dark);color:#fff;font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;padding:.7rem 1.4rem;cursor:pointer}
.btn-guardar:hover{background:var(--green-dark)}
@media (max-width:640px){.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}

.confirm{background:var(--green-light);border-left-color:var(--green)}
.rs-opt{border-radius:8px;border:1.5px solid var(--red-mid);background:var(--red-light);color:var(--rojo);font-weight:600}
.rs-opt:hover{background:var(--rojo);border-color:var(--red-dark);color:#fff}
.done{background:var(--green-light);border-left-color:var(--green);color:var(--green-dark)}
.done.no{background:var(--red-light);border-left-color:var(--rojo);color:var(--red-dark)}
@media (max-width:640px){
  .acts .btn-accion{min-height:84px;width:100%}
  .btn-icono{width:40px;height:40px}
  .btn-texto{font-size:12px}
  .confirm .btn-guardar{min-height:50px;font-size:14px}
}

.tag.crit{background:var(--rojoBg);color:var(--rojo)}
.tag{white-space:nowrap}
.eqlist{display:none;margin:.9rem 0 0;padding:0;list-style:none;border-top:1px solid var(--z200)}
.eqlist li{border-bottom:1px solid var(--z200)}
.eqlist a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.25rem .75rem;padding:.75rem 0;text-decoration:none;color:var(--tinta)}
.eqlist .nm{font-size:14px;font-weight:600}
.eqlist .sub{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.2rem .8rem;font-size:12px;color:var(--z500);align-items:center}
.eqlist .chev{color:var(--z400);font-size:18px;line-height:1}
@media (max-width:640px){
  body{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  .topbar-in{min-height:3.25rem;flex-wrap:nowrap;gap:.6rem}
  .topbar-in .logo{height:1.3rem}
  .divider{height:1.4rem}
  .app-title p:first-child{font-size:15px;white-space:nowrap}
  .pill-top{padding:.35rem .55rem;font-size:11px;white-space:nowrap}
  .canvas{padding-block:1rem 1.5rem}
  .page-head{margin-bottom:.75rem}
  .lime-rule{margin-bottom:.6rem}
  h1{font-size:1.5rem;line-height:1.8rem}
  .bajada{margin-top:.25rem;font-size:13px}
  .proto{font-size:12px;padding:.55rem .75rem;margin-bottom:.9rem}
  .stack{gap:.9rem}
  .card-note{font-size:12.5px}
  .switch{position:fixed;left:0;right:0;bottom:0;z-index:65;display:grid;grid-template-columns:repeat(3,1fr);border:0;border-top:1px solid var(--z200);border-radius:0;padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px));gap:6px;box-shadow:0 -6px 20px rgb(0 0 0 / .05)}
  .switch a{text-align:center;padding:.8rem .25rem;font-size:14px;font-weight:500}
  .acts{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
  .acts .btn{min-height:46px;font-size:14px}
  .acts:empty{display:none}
  .confirm{display:grid;grid-template-columns:1fr}
  .confirm input,.confirm input.wide{width:100%;min-height:42px;font-size:16px}
  .confirm .btn{min-height:46px;font-size:14px}
  .motivos{display:grid;grid-template-columns:1fr 1fr;gap:.45rem}
  .motivos>span{grid-column:1/-1}
  .rs-opt{min-height:44px;font-size:13px}
  .link-btn{padding:.6rem .4rem}
  .task summary{padding:.35rem 0}
  .eqtable{display:none}
  .eqlist{display:block}
}

.no-t{color:var(--rojo);font-weight:600}
</style>

/* ---------------- fechas ---------------- */
const hoy0 = ()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const p2 = n=>String(n).padStart(2,'0');
const isoDia = d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const isoHora = d=>`${isoDia(d)}T${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`;
const parseDia = s=>{ if(!s) return null; const m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})/); return m? new Date(+m[1],+m[2]-1,+m[3]) : null };
const fmt = d=>d.toLocaleDateString('es-CL',{day:'2-digit',month:'2-digit',year:'numeric'});
const fmtc = d=>d.toLocaleDateString('es-CL',d.getFullYear()===new Date().getFullYear()?{day:'numeric',month:'short'}:{day:'numeric',month:'short',year:'numeric'});
const horaTxt = s=>{const m=String(s).match(/T(\d{2}):(\d{2})/);return m?`${m[1]}:${m[2]}`:''};
function lunesDe(d){const l=new Date(d);l.setDate(d.getDate()-((d.getDay()+6)%7));l.setHours(0,0,0,0);return l}
function pauta(f){const t=[[1,'Diaria'],[5,'Semanal'],[10,'Quincenal'],[25,'Mensual'],[40,'Cada 1,5 meses'],[55,'Bimestral'],[85,'Trimestral'],[115,'Cuatrimestral'],[170,'Semestral'],[195,'Cada 200 días'],[300,'Anual'],[500,'Cada 18 meses'],[700,'Cada 2 años'],[1000,'Cada 3 años'],[1700,'Cada 5 años']];let r='';for(const[a,b]of t){if(f>=a)r=b}return r}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const n2 = i=>p2(i);

function registrosVigentes(){
  const ids=new Set(), out=[];
  for(const r of [...S.registros, ...S.cola.filter(o=>o.op==='reg').map(o=>o.r)]){
    if(ids.has(r.id_registro)) continue; ids.add(r.id_registro);
    out.push(r);
  }
  const anulados=new Set(S.cola.filter(o=>o.op==='anular').map(o=>o.id));
  return out.filter(r=>!(String(r.anulado).toLowerCase()==='true'||r.anulado===true||anulados.has(r.id_registro)));
}
function modelo(){
  const HOY=hoy0(), LUN=lunesDe(HOY);
  const eq=Object.fromEntries(S.equipos.map(e=>[e.id_equipo,e]));
  const regs=registrosVigentes();
  const ultHecha={}, semana={}, deHoy={};
  for(const r of regs){
    const d=parseDia(r.fecha_hora); if(!d) continue;
    if(d.getTime()===HOY.getTime()) deHoy[r.id_tarea]=r;
    if(r.resultado==='Realizada' && (!ultHecha[r.id_tarea] || d>ultHecha[r.id_tarea])) ultHecha[r.id_tarea]=d;
    if(d>=LUN){ const prev=semana[r.id_tarea]; if(!prev || String(r.fecha_hora)>String(prev.fecha_hora)) semana[r.id_tarea]=r }
  }
  const ts=S.tareas.map(t=>{
    const e=eq[t.id_equipo]||{equipo:t.id_equipo,criticidad:'B',fuente_horas:'calendario'};
    const freq=Number(t.frecuencia_dias)||0, min=Number(t.tiempo_min)||0;
    const base=parseDia(t.fecha_base), uh=ultHecha[t.id_tarea];
    const ult = base&&uh ? (uh>base?uh:base) : (uh||base);
    const o={...t, e, freq, min, ult, activa:t.estado==='Activa', reg:semana[t.id_tarea]||null};
    if(!o.activa){o.est='No programada';return o}
    if(!freq){o.est='Sin frecuencia';return o}   // activa pero por horas sin uso definido: se ve en Equipos, no entra al plan
    if(freq===1){   // tarea diaria (lunes a sábado): solo cuenta el registro de hoy
      o.diaria=true; o.reg=deHoy[t.id_tarea]||null; o.ciclos=0;
      if(o.reg || HOY.getDay()===0){ o.prox=new Date(HOY.getTime()+DIA); o.dias=1; o.est='Al día' }
      else { o.prox=new Date(HOY); o.dias=0; o.est='Por vencer' }
      return o;
    }
    if(!ult){o.ult=null; o.prox=new Date(HOY); o.dias=0; o.est='Por vencer'; o.ciclos=0; o.nueva=true; return o}   // tarea nueva sin fecha: toca hoy
    o.prox=new Date(ult.getTime()+freq*DIA);
    o.dias=Math.round((o.prox-HOY)/DIA);
    o.est=o.dias<0?'Vencida':o.dias<=7?'Por vencer':'Al día';
    o.ciclos=o.dias<0?(-o.dias)/freq:0;
    return o;
  });
  return {ts, eq, regs, HOY, LUN};
}
function capH(){ return Number(S.config.horas_semana)||25 }   // horas por semana para preventivo
function plan(ts){
  const cand=ts.filter(t=>t.activa && (t.est==='Vencida'||t.est==='Por vencer'||t.reg));
  const cr=c=>({A:0,B:1,C:2}[c]??3);
  const alDia=t=>t.est==='Vencida'?1:0;   // primero lo que toca esta semana (no se atrasa), después recuperar lo vencido
  cand.sort((a,b)=>((b.diaria?1:0)-(a.diaria?1:0)) || (cr(a.e.criticidad)-cr(b.e.criticidad)) || (alDia(a)-alDia(b)) || ((b.ciclos||0)-(a.ciclos||0)) || ((a.dias??0)-(b.dias??0)));
  let acc=0; const dentro=[], fuera=[];
  for(const t of cand){const m=(t.min||MIN_DEF)*(t.diaria?6:1);   // las diarias reservan 6 días de la semana
    if(t.diaria || t.reg || acc+m<=capH()*60){dentro.push(t);acc+=m} else fuera.push(t)}
  return {dentro,fuera,min:acc};
}

const critTag = c=>`<span class="tag ${c==='A'?'crit':'critB'}">Crit. ${esc(c)}</span>`;
const ICON_OK='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const ICON_NO='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
function estadoTxt(t){
  if(t.est==='Vencida') return (t.dias===-1?`<span class="late">Vencida desde ayer</span>`:`<span class="late">Vencida hace ${-t.dias} días</span>`);
  if(t.diaria) return `<span class="soon">Todos los días · hoy</span>`;
  if(t.est==='Sin frecuencia') return `<span class="soon">Por horas (${esc(t.frecuencia_horas||'')} hr) · falta el uso del equipo en la planilla</span>`;
  if(t.est==='Por vencer') return t.dias===0?`<span class="soon">Vence hoy</span>`:(t.dias===1?`<span class="soon">Vence mañana</span>`:`<span class="soon">Vence en ${t.dias} días</span>`);
  if(t.est==='Al día') return `<span>Próxima: ${fmt(t.prox)}</span>`;
  return `<span>${t.est}</span>`;
}
function motivos(){ const m=String(S.config.motivos||'').split(',').map(x=>x.trim()).filter(Boolean); return m.length?m:MOTIVOS_DEF }
const ICON_LIBRO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M8 7.5h8M8 11h6"/></svg>';
const ICON_CHEV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
const ICON_DOC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>';
function comoHTML(t){
  if(!t.referencia && !t.ref_manual) return '';
  const ref=String(t.ref_manual||'').trim();
  return `<details class="como">
    <summary><span class="como-ic">${ICON_LIBRO}</span><span>Cómo hacerlo</span><span class="como-chev">${ICON_CHEV}</span></summary>
    <div class="como-body">
      ${t.referencia?`<p>${esc(t.referencia)}</p>`:''}
      ${ref?`<div class="como-ref"><span class="como-doc">${ICON_DOC}</span><span>${esc(ref)}</span></div>`:''}
    </div></details>`;
}
function taskHTML(t){
  const r=t.reg;
  const tiempo=t.min?`${t.min} min`:`~${MIN_DEF} min (estimado)`;
  let foot='', acts='';
  if(r && r.resultado==='Realizada'){
    foot=`<div class="done"><b>✓ Realizada</b> · ${fmtc(parseDia(r.fecha_hora))} ${horaTxt(r.fecha_hora)}${r.comentario?` · ${esc(r.comentario)}`:''}</div>`;
  } else if(r && r.resultado==='No realizada'){
    foot=`<div class="done no"><b>✕ No realizada</b> · ${esc(r.motivo)} · vuelve al plan de la próxima semana</div>`;
  } else if(UI.abierta===t.id_tarea){
    foot=`<div class="motivos"><span>¿Por qué no se realizó?</span>${motivos().map(m=>`<button class="rs-opt" data-mot="${esc(t.id_tarea)}" data-m="${esc(m)}">${esc(m)}</button>`).join('')}<button class="link-btn" data-cancel="1">Cancelar</button></div>`;
  }
  if(!r && UI.abierta!==t.id_tarea && t.activa) acts=`<button class="btn-accion btn-andar" data-ok="${esc(t.id_tarea)}"><span class="btn-icono">${ICON_OK}</span><span class="btn-texto">Realizada</span></button><button class="btn-accion btn-parar" data-no="${esc(t.id_tarea)}"><span class="btn-icono">${ICON_NO}</span><span class="btn-texto">No realizada</span></button>`;
  return `<div class="task">
    <div><div class="d">${esc(t.tarea)}</div>
    <div class="m">${r?'':estadoTxt(t)}<span>${TIPO[t.tipo]||esc(t.tipo)}</span><span>${pauta(t.freq)}</span><span>${tiempo}</span>${t.ult?`<span>Última: ${fmt(t.ult)}</span>`:''}</div></div>
    <div class="acts">${acts}</div>
    ${comoHTML(t)}
    ${foot}</div>`;
}
function vSemana(){
  const M=modelo(), p=plan(M.ts), dom=new Date(M.LUN.getTime()+6*DIA);
  const realizadas=p.dentro.filter(t=>t.reg&&t.reg.resultado==='Realizada').length;
  const pendientes=p.dentro.filter(t=>!t.reg).length;
  const pos=Object.fromEntries(S.tareas.map((t,i)=>[t.id_tarea,i]));
  const g={}; p.dentro.forEach(t=>{(g[t.id_equipo]=g[t.id_equipo]||[]).push(t)});
  const cr=c=>({A:0,B:1,C:2}[c]??3);
  const tieneDiaria=id=>g[id].some(t=>t.diaria)?0:1;
  const orden=Object.keys(g).sort((a,b)=>tieneDiaria(a)-tieneDiaria(b) || cr(M.eq[a]?.criticidad)-cr(M.eq[b]?.criticidad) || g[b].length-g[a].length);
  const pct=p.dentro.length?Math.round((p.dentro.length-pendientes)/p.dentro.length*100):0;
  return `<section class="card">
    <div class="card-head"><span class="fmtNum">01</span><h2>Plan de la semana</h2><span class="tag">${fmtc(M.LUN)} – ${fmtc(dom)}</span></div>
    <p class="card-note">Tareas de esta semana, ordenadas por prioridad: empieza por el primer equipo.</p>
    <div class="kpis">
      <div class="kpi"><div class="n">${p.dentro.length}</div><div class="l">Tareas de la semana</div></div>
      <div class="kpi ok"><div class="n">${realizadas}</div><div class="l">Realizadas</div></div>
      <div class="kpi"><div class="n">${pendientes}</div><div class="l">Pendientes</div></div>
    </div>
    <div class="cap"><div class="bar avance-sem"><span style="width:${pct}%"></span></div></div>
  </section>
  ${orden.map((id,i)=>{const e=M.eq[id]||{equipo:id,criticidad:'B',fuente_horas:'calendario'};const ts=g[id].slice().sort((a,b)=>pos[a.id_tarea]-pos[b.id_tarea]);return `<section class="card">
    <div class="card-head"><span class="fmtNum">${n2(i+2)}</span><h2>${esc(e.equipo)}</h2>${critTag(e.criticidad)}<span class="head-right">${ts.length} tareas</span></div>
    <div class="tasks">${ts.map(taskHTML).join('')}</div></section>`}).join('')}
  ${orden.length?'':`<section class="card"><p class="card-note">No hay tareas pendientes esta semana.</p></section>`}`;
}
function vEquipos(){
  const M=modelo(); const cr=c=>({A:0,B:1,C:2}[c]??3);
  const rows=S.equipos.map(q=>{const a=M.ts.filter(t=>t.id_equipo===q.id_equipo&&t.activa&&t.freq);
    const v=a.filter(t=>t.est==='Vencida').length, ok=a.filter(t=>t.est==='Al día'||t.est==='Por vencer').length;
    const nx=a.filter(t=>t.prox&&t.est!=='Vencida').sort((x,y)=>x.prox-y.prox)[0];
    return {q,n:a.length,v,pct:a.length?ok/a.length:0,nx}}).sort((a,b)=>cr(a.q.criticidad)-cr(b.q.criticidad)||b.v-a.v);
  return `<section class="card">
  <div class="card-head"><span class="fmtNum">01</span><h2>Estado por equipo</h2><span class="tag">${rows.length} equipos</span></div>
  <p class="card-note">Toca un equipo para ver todas sus tareas y registrar cualquiera, aunque no esté en el plan de la semana.</p>
  <ul class="eqlist">${rows.map(r=>`<li><a href="#equipo-${esc(r.q.id_equipo)}"><span class="nm">${esc(r.q.equipo)}</span><span class="chev">›</span>
    <span class="sub">${critTag(r.q.criticidad)}<span><span class="minibar"><span style="width:${Math.round(r.pct*100)}%"></span></span>${Math.round(r.pct*100)}% al día</span><span class="${r.v?'late':''}">${r.v} vencidas</span>${r.nx?`<span>Próxima ${fmtc(r.nx.prox)}</span>`:''}</span></a></li>`).join('')}</ul>
  <div class="tscroll eqtable"><table><thead><tr><th>Equipo</th><th>Crit.</th><th>Al día</th><th class="num">Vencidas</th><th>Próxima tarea</th></tr></thead><tbody>
  ${rows.map(r=>`<tr class="rowlink" data-eq="${esc(r.q.id_equipo)}" tabindex="0"><td><b>${esc(r.q.equipo)}</b><div class="src">${esc(r.q.codigo_planta||'sin código')} · ${FUENTE[r.q.fuente_horas]||'Calendario'}</div></td><td>${critTag(r.q.criticidad)}</td>
  <td style="white-space:nowrap"><span class="minibar"><span style="width:${Math.round(r.pct*100)}%"></span></span>${Math.round(r.pct*100)}%</td>
  <td class="num ${r.v?'late':''}">${r.v}</td><td>${r.nx?fmtc(r.nx.prox):'—'}</td></tr>`).join('')}
  </tbody></table></div></section>`;
}
function vEquipo(id){
  const M=modelo(), e=M.eq[id]; if(!e) return vEquipos();
  const ord={'Vencida':0,'Por vencer':1,'Sin frecuencia':2,'Al día':3,'Sin fecha base':4,'No programada':5};
  const a=M.ts.filter(t=>t.id_equipo===id).sort((x,y)=>(ord[x.est]-ord[y.est])||((x.dias??0)-(y.dias??0)));
  const hist=M.regs.filter(r=>r.id_equipo===id).sort((x,y)=>String(y.fecha_hora).localeCompare(String(x.fecha_hora))).slice(0,15);
  const nom=Object.fromEntries(S.tareas.map(t=>[t.id_tarea,t.tarea]));
  return `<a class="back" href="#equipos">‹ Volver a equipos</a>
  <section class="card"><div class="card-head"><span class="fmtNum">01</span><h2>${esc(e.equipo)}</h2>${critTag(e.criticidad)}<span class="head-right">${a.length} tareas · ${FUENTE[e.fuente_horas]||'Calendario'}</span></div>
  <div class="tasks">${a.map(taskHTML).join('')}</div></section>
  <section class="card"><div class="card-head"><span class="fmtNum">02</span><h2>Últimos registros</h2></div>
  ${hist.length?`<ul class="reglist">${hist.map(r=>`<li><span class="when">${fmtc(parseDia(r.fecha_hora))} ${horaTxt(r.fecha_hora)}</span><span>${esc(nom[r.id_tarea]||r.id_tarea)}${r.motivo?` · ${esc(r.motivo)}`:''}</span><span class="${r.resultado==='Realizada'?'ok-t':'no-t'}">${esc(r.resultado)}</span></li>`).join('')}</ul>`:`<p class="card-note">Aún no hay registros de este equipo en la app.</p>`}
  </section>`;
}
function vResumen(){
  const M=modelo(); const act=M.ts.filter(t=>t.activa&&t.freq);
  const p=plan(M.ts), fueraMin=p.fuera.reduce((a,t)=>a+(t.min||MIN_DEF),0);
  const fueraEq={}; p.fuera.forEach(t=>{fueraEq[t.e.equipo]=(fueraEq[t.e.equipo]||0)+1});
  const by=c=>{const a=act.filter(t=>!c||t.e.criticidad===c);const v=a.filter(t=>t.est==='Vencida');return {n:a.length,v:v.length,pct:a.length?1-v.length/a.length:0,h:v.reduce((s,t)=>s+(t.min||MIN_DEF),0)/60}};
  const T=by(), A=by('A'), B=by('B');
  const desde=new Date(M.HOY.getTime()-30*DIA);
  const r30=M.regs.filter(r=>{const d=parseDia(r.fecha_hora);return d&&d>=desde});
  const mot={}; r30.filter(r=>r.resultado==='No realizada').forEach(r=>{mot[r.motivo]=(mot[r.motivo]||0)+1});
  const mx=Math.max(1,...Object.values(mot));
  const semH=M.regs.filter(r=>parseDia(r.fecha_hora)>=M.LUN&&r.resultado==='Realizada').length;
  const semN=M.regs.filter(r=>parseDia(r.fecha_hora)>=M.LUN&&r.resultado==='No realizada').length;
  const tr=(l,o)=>`<tr><td>${l}</td><td class="num">${o.n}</td><td class="num ${o.v?'late':''}">${o.v}</td><td class="num">${Math.round(o.h)} h</td><td style="white-space:nowrap"><span class="minibar"><span style="width:${Math.round(o.pct*100)}%"></span></span>${(o.pct*100).toFixed(1)}%</td></tr>`;
  return `<section class="card"><div class="card-head"><span class="fmtNum">01</span><h2>Cumplimiento</h2><span class="tag">Al ${fmt(M.HOY)}</span></div>
    <div class="kpis"><div class="kpi"><div class="n">${(T.pct*100).toFixed(1)}%</div><div class="l">Cumplimiento planta</div></div>
    <div class="kpi bad"><div class="n">${T.v}</div><div class="l">Tareas vencidas</div></div>
    <div class="kpi"><div class="n">${Math.round(T.h)} h</div><div class="l">Atraso estimado</div></div></div>
    <div class="tscroll"><table><thead><tr><th>Criticidad</th><th class="num">Tareas</th><th class="num">Vencidas</th><th class="num">Atraso</th><th>Cumplimiento</th></tr></thead>
    <tbody>${tr('A · detiene la línea',A)}${tr('B · afecta recuperación',B)}</tbody></table></div>
    <p class="card-note">Esta semana: ${semH} tareas realizadas y ${semN} no realizadas. El atraso en horas usa el tiempo de cada tarea, o ${MIN_DEF} min cuando falta.</p></section>
  <section class="card"><div class="card-head"><span class="fmtNum">02</span><h2>Carga de la semana</h2><span class="tag">${capH()} h disponibles</span></div>
    <div class="kpis"><div class="kpi"><div class="n">${p.dentro.length}</div><div class="l">Tareas en el plan</div></div>
    <div class="kpi"><div class="n">${(p.min/60).toFixed(1)} h</div><div class="l">Horas planificadas</div></div>
    <div class="kpi bad"><div class="n">${p.fuera.length}</div><div class="l">Vencidas que no caben</div></div></div>
    <div class="cap"><div class="caprow"><span>Horas planificadas <b>${(p.min/60).toFixed(1)} h</b> de <b>${capH()} h</b> disponibles</span></div><div class="bar"><span style="width:${Math.min(100,p.min/(capH()*60)*100)}%"></span></div></div>
    ${p.fuera.length?`<div class="notice"><b>${p.fuera.length} tareas vencidas no caben esta semana</b> (≈${Math.round(fueraMin/60)} h): ${Object.entries(fueraEq).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([n,c])=>`${esc(n)} ${c}`).join(', ')}${Object.keys(fueraEq).length>4?'…':''}. Pasan solas a las semanas siguientes.</div>`:''}
  </section>
  <section class="card"><div class="card-head"><span class="fmtNum">03</span><h2>Motivos de no ejecución</h2><span class="tag">Últimos 30 días</span></div>
    ${Object.keys(mot).length?`<div class="hbars">${Object.entries(mot).sort((a,b)=>b[1]-a[1]).map(([m,c])=>`<div class="hb"><span>${esc(m)}</span><div class="bar"><span style="width:${c/mx*100}%"></span></div><b>${c}</b></div>`).join('')}</div>`:`<p class="empty">Sin tareas marcadas como "No realizada" en los últimos 30 días.</p>`}</section>
`;
}

/* ---------------- render ---------------- */
function vista(){ const h=(location.hash||'#semana').slice(1); if(h.startsWith('equipo-')) return ['equipos',h.slice(7)]; return [['semana','equipos','resumen'].includes(h)?h:'semana',null] }
function render(){
  const [v,id]=vista();
  document.querySelectorAll('.switch a').forEach(a=>{if(a.dataset.v===v)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  document.getElementById('app').innerHTML = id? vEquipo(id) : v==='equipos'? vEquipos() : v==='resumen'? vResumen() : vSemana();
  document.getElementById('demo-note').hidden=!DEMO;
}
function abrirConfirmar(id){
  const t=S.tareas.find(x=>x.id_tarea===id); if(!t) return;
  const m=document.getElementById('modal');
  m.innerHTML=`<div class="modal-box">
    <div class="modal-ic">${ICON_OK}</div>
    <h3 id="modal-t">¿Confirmas que esta tarea está realizada?</h3>
    <p class="modal-tarea">${esc(t.tarea)}</p>
    <div class="modal-btns"><button class="btn-si" data-si="${esc(id)}">Sí, está realizada</button><button class="btn-cancelar" data-cerrar="1">Cancelar</button></div>
  </div>`;
  m.hidden=false; document.body.classList.add('con-modal');
  const s=m.querySelector('.btn-si'); if(s) s.focus();
}
function cerrarConfirmar(){ const m=document.getElementById('modal'); m.hidden=true; m.innerHTML=''; document.body.classList.remove('con-modal') }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') cerrarConfirmar() });
function toast(msg, err){ const t=document.createElement('div'); t.className='toast'+(err?' err':''); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2600) }

/* ---------------- registrar ---------------- */
function nuevoId(){ return 'R-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6) }
function registrar(idTarea, resultado, extra){
  const t=S.tareas.find(x=>x.id_tarea===idTarea); if(!t) return;
  const r={id_registro:nuevoId(), fecha_hora:isoHora(new Date()), id_tarea:idTarea, id_equipo:t.id_equipo, resultado,
           motivo:extra.motivo||'', comentario:extra.comentario||'', horometro:extra.horometro||'', registrado_por:S.config.encargado||'', anulado:''};
  S.cola.push({op:'reg', r}); UI.abierta=null; UI.modo=null; save(); render();
  toast(resultado==='Realizada'?'✓ Guardada como realizada':'Guardada como no realizada');
  sync();
}
function editarHoro(idReg, valor){
  if(!valor) return;
  const o=S.cola.find(o=>o.op==='reg'&&o.r.id_registro===idReg);
  if(o) o.r.horometro=valor;
  else { S.cola.push({op:'editar', id:idReg, campos:{horometro:valor}}); const r=S.registros.find(r=>r.id_registro===idReg); if(r) r.horometro=valor }
  save(); render(); toast('✓ Horómetro guardado'); sync();
}
function anular(idReg){
  const i=S.cola.findIndex(o=>o.op==='reg'&&o.r.id_registro===idReg);
  if(i>=0) S.cola.splice(i,1); else S.cola.push({op:'anular', id:idReg});
  save(); render(); toast('Listo, se deshizo'); sync();
}

/* ---------------- planilla ---------------- */
function fetchT(url, opts, ms){ const ac=new AbortController(); const t=setTimeout(()=>ac.abort(), ms||45000); return fetch(url, Object.assign({signal:ac.signal}, opts)).finally(()=>clearTimeout(t)) }
async function leer(){
  const r=await fetchT(SHEET_URL+'?accion=leer',{redirect:'follow',cache:'no-store'});
  const j=await r.json(); if(!j||!j.ok) throw new Error(j&&j.error||'sin datos'); return j;
}
async function enviar(ops){
  const body=JSON.stringify({accion:'lote', ops});
  try{ const r=await fetchT(SHEET_URL,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body},60000);
       if((await r.text()).includes('"ok":true')) return true }catch(e){}
  await fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body});
  return false;
}
async function sync(manual){
  if(DEMO){ renderSync(); if(manual) toast('Modo demostración: falta conectar la planilla.'); return }
  if(syncing) return; syncing=true;
  try{
    if(S.cola.length){ const ops=S.cola.slice(); await enviar(ops); }
    const j=await leer();
    S.equipos=j.equipos||S.equipos; S.tareas=j.tareas||S.tareas; S.registros=j.registros||[]; S.config=j.config||S.config;
    // lo que ya está en la planilla sale de la cola
    const enHoja=new Set(S.registros.map(r=>r.id_registro));
    const anuladosHoja=new Set(S.registros.filter(r=>String(r.anulado).toLowerCase()==='true').map(r=>r.id_registro));
    const horoHoja=Object.fromEntries(S.registros.map(r=>[r.id_registro,String(r.horometro||'')]));
    S.cola=S.cola.filter(o=> o.op==='reg' ? !enHoja.has(o.r.id_registro) : o.op==='editar' ? horoHoja[o.id]!==String(o.campos.horometro) : !anuladosHoja.has(o.id));
    lastSync=new Date(); syncFails=0; save(); renderSync(); render();
    if(manual) toast('Planilla al día.');
  }catch(e){
    syncFails++; renderSync(syncFails>=3?'mal':'reintento');
    if(manual) toast('La planilla está lenta; se vuelve a intentar sola.', true);
    clearTimeout(retryTimer); retryTimer=setTimeout(sync, Math.min(15000*syncFails, 60000));
  }finally{ syncing=false }
}
function renderSync(mal){
  const dot=document.getElementById('sync-dot'), lab=document.getElementById('sync-label'), pill=document.getElementById('sync-state');
  const hh=d=>`${p2(d.getHours())}:${p2(d.getMinutes())}`;
  if(DEMO){ dot.style.background='#A1A1AA'; lab.textContent='Demostración'; pill.title='Sin planilla conectada: los registros quedan en este dispositivo'; return }
  if(mal==='mal'){ dot.style.background='#FF6B5A'; lab.textContent=S.cola.length?`Sin conexión · ${S.cola.length} por enviar`:'Sin conexión'; pill.title='No se pudo llegar a la planilla; los registros quedan guardados y se envían solos'; return }
  if(mal==='reintento'){ dot.style.background='#E8A33D'; lab.textContent='Reintentando'; pill.title='La planilla está lenta; se reintenta solo'; return }
  dot.style.background='var(--neon)'; lab.textContent=lastSync?`Actualizado ${hh(lastSync)}`:'Conectando'; pill.title='Toca para actualizar';
}

/* ---------------- eventos ---------------- */
document.addEventListener('click',e=>{
  if(e.target.id==='modal'){ cerrarConfirmar(); return }
  const row=e.target.closest('tr[data-eq]'); if(row){ location.hash='equipo-'+row.dataset.eq; return }
  const b=e.target.closest('button'); if(!b) return;
  const d=b.dataset;
  if(b.id==='sync-state'){ sync(true); return }
  if(d.ok){ abrirConfirmar(d.ok) }
  else if(d.si){ cerrarConfirmar(); registrar(d.si,'Realizada',{}) }
  else if(d.cerrar){ cerrarConfirmar() }
  else if(d.no){ UI.abierta=d.no; UI.modo='no'; render() }
  else if(d.mot){ registrar(d.mot,'No realizada',{motivo:d.m}) }
  else if(d.cancel){ UI.abierta=null; UI.modo=null; render() }
  else if(d.undo){ anular(d.undo) }
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-form]'); if(!f) return; e.preventDefault();
  registrar(f.dataset.form,'Realizada',{comentario:f.com.value.trim()});
});
window.addEventListener('hashchange',()=>{UI.abierta=null;render();window.scrollTo(0,0)});
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) sync() });

load();
document.getElementById('version').title=VERSION;
document.getElementById('hoy').textContent='Planta GIRI · hoy '+fmt(hoy0());
renderSync(); render(); sync();
setInterval(()=>sync(), 5*60000);
</script>
